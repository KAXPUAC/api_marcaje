[project]
name = "api-marcaje"
version = "0.1.0"
description = "API para el sistema de marcaje de ingrso administrativo, reconocimiento Facial con Amazon Rekognition y almacenamiento en S3."
readme = "README.md"
authors = [
    { name = "Kevin Axpuac", email = "kevinaxpuac@hotmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.113",
    "fastapi[standard]>=0.143.1",
    "oracledb>=26.0.1",
]

[project.scripts]
api-marcaje = "api_marcaje:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
